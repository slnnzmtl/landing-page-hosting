server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression is Caddy `encode gzip zstd` on kazansky.dev (edge).
    # Do not gzip here: a gzipped upstream makes Caddy skip zstd.

    # Serve custom 404 body with real 404 status (not 200)
    error_page 404 /404.html;

    # Hide dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Nuxt deploy manifests: revalidate so clients notice a new build
    location ^~ /_nuxt/builds/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Immutable hashed Nuxt assets
    location ^~ /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CMS media (UUID paths); keep immutable so documents can use no-cache
    location ^~ /cms-files/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /u.js {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* ^/(favicon\.ico|favicon-32x32\.png|favicon-16x16\.png|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Media must win over HTML fallback: keep this ^~ so regex elsewhere cannot steal it.
    location ^~ /projects/ {
        location ~* \.(webp|png|jpe?g|svg|gif)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Nuxt payload used by the shell; revalidate so hashed /_nuxt/ URLs stay in sync
    location = /_payload.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-only service layer: SPA fallback to Nuxt 200.html
    # Prefer $uri/index.html over $uri/ to avoid trailing-slash 301s.
    location ^~ /service {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /200.html;
    }

    # Product / legacy project pages: known files 200, else 404.html
    location ^~ /products {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /finance {
        return 404;
    }

    location ^~ /finance/ {
        return 404;
    }

    location = /login {
        return 404;
    }

    # Prerendered sitemap: keep application/xml (nginx mime.types would send text/xml).
    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Prerendered pages + static assets; unknown paths → 404
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
